# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane splits (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# Status bar
set -g status-interval 5
set -g status-left-length 30
set -g status-left "#[bold]#S "
set -g status-right "%Y-%m-%d %H:%M"

# Window list entries default to just "<index>:<auto-detected-name>" (e.g. "1:zsh"),
# which is identical across every idle shell regardless of directory. Append the
# current pane's directory so windows are distinguishable at a glance.
set -g window-status-format "#I:#W (#{b:pane_current_path})"
set -g window-status-current-format "#I:#W (#{b:pane_current_path})"

# Same problem one level down: once a window has multiple panes, nothing shows
# which pane is which. Label each pane's border with its directory.
set -g pane-border-status top
set -g pane-border-format "#{pane_current_path}"
